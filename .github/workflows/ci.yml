name: CI/CD

on:
  push:
    branches: ["main"]
    # Mudanca so de documentacao nao publica (e nao liga a Function App parada)
    paths-ignore: ["docs/**", "**.md"]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # So as dependencias de producao: Core Tools e Azurite sao apenas para o ambiente local
      - run: npm ci --omit=dev
      - run: for arquivo in src/functions/*.js src/lib/*.js; do node --check "$arquivo"; done
      - run: node -e "for (const f of require('fs').readdirSync('src/functions')) require('./src/functions/' + f)"

  # Validacoes de qualidade pedidas na atividade de CI, nas ferramentas de Node.js:
  # ESLint no lugar de flake8/pylint/ruff, Prettier no lugar de black/yapf e a
  # regra de ordem dos imports do ESLint no lugar do isort
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts pula o download do Core Tools, que estas validacoes nao usam
      - run: npm ci --ignore-scripts
      - name: Linting (ESLint)
        run: npm run lint
      - name: Formatacao (Prettier)
        run: npm run format:check
      - name: Verificacao de imports (ESLint import-x/order)
        run: npm run imports

  deploy:
    needs: [validar, qualidade]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_FUNCTIONAPP_NAME: 'func-tapra-2026-jvr-cus'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Com a Function App parada, o sync trigger do deploy falha
      - run: |
          RG=$(az functionapp list --query "[?name=='$AZURE_FUNCTIONAPP_NAME'].resourceGroup | [0]" -o tsv)
          az functionapp start --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$RG"
          echo "RG=$RG" >> "$GITHUB_ENV"
      # Container da camada bronze no Data Lake. O -o none evita que o az imprima
      # no log do Actions todas as Application settings, inclusive as senhas
      - run: |
          az functionapp config appsettings set --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$RG" \
            --settings DATALAKE_CONTAINER=bronze -o none
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: .
          respect-funcignore: true
