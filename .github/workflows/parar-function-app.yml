# Para a Function App para economizar credito. O deploy do CI/CD liga de novo.
# Rode em Actions > Parar Function App > Run workflow.
name: Parar Function App

on:
  workflow_dispatch:

jobs:
  parar:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_FUNCTIONAPP_NAME: 'func-tapra-2026-jvr-cus'
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: |
          RG=$(az functionapp list --query "[?name=='$AZURE_FUNCTIONAPP_NAME'].resourceGroup | [0]" -o tsv)
          az functionapp stop --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$RG"
          echo "estado: $(az functionapp show --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$RG" --query state -o tsv)"
